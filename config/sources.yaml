# =====================================================================
# Source registry — US Midterm Election Intelligence Database
#
# Every URL here is UNVERIFIED until `python -m scripts.verify_sources`
# has checked it from your network; results go to source_link_checks
# and state_source_registry.urls_verified_at.
#
# A null URL, or adapter_status: not_implemented, means "no working
# integration". Never treat it as completed coverage.
# =====================================================================

election:
  year: 2026
  general_election_date: "2026-11-03"
  historical_cycles: [2014, 2016, 2018, 2020, 2022, 2024]

coverage:
  include_states: true
  include_dc: true
  include_counties: true
  include_congressional_districts: true
  include_state_legislative_districts: true
  include_local_jurisdictions: true

# ---------------------------------------------------------------------
# National / third-party sources
# authority_level: official_election_authority | official_federal |
#                  academic | third_party | commercial | project_reference
# ---------------------------------------------------------------------
sources:
  openfec:
    name: OpenFEC API
    base_url: https://api.open.fec.gov/v1
    source_type: api
    authority_level: official_federal
    access_type: free_key            # https://api.open.fec.gov/developers/
    terms_url: https://www.fec.gov/updates/sale-or-use-contributor-information/
    license_notes: >-
      Public data. Individual contributor names/addresses may not be sold or used
      to solicit contributions or for commercial purposes (52 U.S.C. 30111(a)(4)).
    rate_limit_per_hour: 1000        # documented standard key limit; DEMO_KEY is far lower
    enabled: true

  election_org:
    name: Election.org
    base_url: https://election.org/api/v1
    source_type: csv_download
    authority_level: third_party
    access_type: free_public_beta
    license_notes: Candidate filings are not proof of ballot qualification (provider warning).
    enabled: true
    datasets:
      federal_contests_2026: /downloads/federal-contests-2026.csv
      federal_candidates_2026: /downloads/federal-candidates-2026.csv
      federal_results_2020: /downloads/federal-results-2020.csv
      federal_results_2022: /downloads/federal-results-2022.csv
      federal_results_2024: /downloads/federal-results-2024.csv
    # Optional: columns that MUST exist. Empty = record fingerprint only and
    # flag any change against the previously seen column set.
    required_columns: {}

  civicapi:
    name: civicAPI
    base_url: https://civicapi.org/api/v2
    source_type: api
    authority_level: third_party
    access_type: free_no_key
    attribution: Election results data from civicAPI (https://civicapi.org) — attribution required for non-personal use
    enabled: true
    # Endpoints and fields taken from https://civicapi.org/api-documentation and live
    # responses observed on 2026-11-04.
    endpoints:
      results: race/search          # paged with limit/offset; one record per race
      race_detail: race/{race_id}   # per-race detail (county breakdowns when has_breakdown)
      race_history: race/{race_id}/history/
      status: status
      polls: null                   # not identified in the v2 docs yet
    query:
      results:
        # Governors and other statewide races (one paged search)
        - params: {startDate: "2026-11-03", endDate: "2026-11-03", country: US, election_type: Statewide}
        # US Senate + US House: one General-election search per state (returns just the federal races)
        - params: {startDate: "2026-11-03", endDate: "2026-11-03", country: US, election_type: General}
          per_state: true
    page_size: 500
    concurrency: 4                  # parallel requests; the client still starts at most 1/second
    field_maps:
      results:
        records_path: races
        race_id: id
        state: province
        office: type
        district: district
        percent_reporting: percent_reporting
        candidates_path: candidates
        choice: name
        party: party
        votes: votes
        percent: percent
        winner_flag: winner
        caller: civicAPI
      polls: {}
    # civicAPI race 'type' -> office modeled in this project (labels observed in live
    # responses on election night; unmapped types are logged on each run).
    office_types:
      Governor: GOVERNOR
      US Senate: US SENATE
      House of Representatives: US HOUSE

  census:
    name: US Census Bureau API
    base_url: https://api.census.gov/data
    source_type: api
    authority_level: official_federal
    access_type: free_key            # works without a key at low volume
    terms_url: https://www.census.gov/data/developers/about/terms-of-service.html
    enabled: true
    # ACS 1-year 2024 uses 119th Congress districts. States that redrew maps
    # mid-decade for 2026 will NOT match these boundaries.
    acs_dataset: "2024/acs/acs1"
    variables:
      B01003_001E: Total population
      B29001_001E: Citizen voting-age population
      B01002_001E: Median age
      B19013_001E: Median household income
      B15003_022E: Population 25+ with bachelor's degree

  google_civic:
    name: Google Civic Information API
    base_url: https://www.googleapis.com/civicinfo/v2
    source_type: api
    authority_level: third_party
    access_type: free_key
    license_notes: Representatives endpoints were retired in 2025; elections, voterinfo and divisions remain.
    enabled: true

  mit_election_lab:
    name: MIT Election Data and Science Lab
    base_url: https://dataverse.harvard.edu
    source_type: csv_download
    authority_level: academic
    access_type: free_no_key
    attribution: MIT Election Data and Science Lab, Harvard Dataverse
    enabled: true
    datasets:
      us_house:
        doi: doi:10.7910/DVN/IG0UN2
        file_pattern: "house"
        office: US HOUSE
      us_senate:
        doi: doi:10.7910/DVN/PEJ5QU
        file_pattern: "senate"
        office: US SENATE
      us_president:
        doi: doi:10.7910/DVN/42MVDX
        file_pattern: "president"
        office: US PRESIDENT

  eac_eavs:
    name: US Election Assistance Commission (EAVS)
    base_url: https://www.eac.gov/research-and-data/datasets-codebooks-and-surveys
    source_type: csv_download
    authority_level: official_federal
    access_type: free_no_key
    enabled: true
    # EAC file URLs change with each release; download manually and point
    # `python -m scripts.ingest_all --only eavs --file <path>` at it.
    latest_published_cycle: 2024
    notes: The 2026 EAVS is a separate collection; do not assume its results are published.

  ap_elections:
    name: Associated Press Elections API
    base_url: https://api.ap.org/v3
    source_type: api
    authority_level: commercial
    access_type: commercial
    enabled: false
    notes: Commercial licence required. Race calls are projections, not certification.

  simulation:
    name: Simulated election night (synthetic test data)
    base_url: null
    source_type: reference
    authority_level: third_party
    access_type: none
    enabled: false
    notes: >-
      Synthetic results produced by scripts/simulate_night.py for testing the live dashboard.
      Only ever written to a separate demo database; candidates are generic party labels.

  project_reference:
    name: Project reference data
    base_url: null
    source_type: reference
    authority_level: project_reference
    access_type: none
    enabled: true
    notes: >-
      Seeded constants (FIPS codes, 2020 apportionment, 2026 Senate/governor seats).
      Marked unverified until corroborated by FEC / state sources.

# ---------------------------------------------------------------------
# Live projection model (heuristic v1 — calibrate against stored snapshots)
# Margins are DEM minus REP two-party share on a -1..1 scale (0.10 = D+10).
# ---------------------------------------------------------------------
model:
  version: live-v1.1               # v1.1: Senate tie-break with an independent holding the balance
  simulations: 10000
  seed: null                       # set an integer for reproducible runs
  national_shift: 0.0              # expected national swing vs. baselines (+ favours DEM)
  national_sd: 0.04                # shared national error, correlates all races in a draw
  prior_sd:
    house: 0.10
    house_redistricted: 0.16       # baseline drawn on old district lines
    house_uncontested_baseline: 0.15
    senate: 0.12
    governor: 0.20                 # no baseline loaded yet: deliberately wide
  observed_weight_k: 20            # weight on counted votes = pct / (pct + k)
  remaining_vote_sd: 0.08          # log-share noise on the composition of uncounted votes
  turnout_sd: 0.30                 # uncertainty in expected total votes at 0% reporting
  status_thresholds: {projected: 0.995, likely: 0.95, lean: 0.75}
  min_pct_for_projection: 5        # never 'projected' before this much is counted
  majority_required: [GA]          # report P(>50%) where a majority avoids a runoff
  # States with new congressional maps for 2026: 2024 House baselines are wider here. Verify.
  redistricted_for_2026: [CA, MO, NC, OH, TX, UT]

chambers:
  senate:
    total_seats: 100
    seats_needed: 51
    tie_breaker: REP               # Vice President breaks 50-50 ties
    # Seats NOT up in 2026, by caucus (independents counted with the caucus they join)
    holdovers: {DEM: 34, REP: 31}
  house:
    total_seats: 435
    seats_needed: 218
    holdovers: {}

# ---------------------------------------------------------------------
# Update schedules (proposed polling intervals, not provider refresh rates)
# ---------------------------------------------------------------------
schedules:
  fec_candidates:        {every_hours: 24}
  fec_committees:        {every_hours: 24}
  fec_finance_totals:    {every_hours: 12}
  fec_contributions:     {every_hours: 12}
  fec_expenditures:      {every_hours: 12}
  fec_election_dates:    {every_hours: 24}
  election_org:          {every_hours: 24}
  # ballot_status:       {every_hours: 12}   # enable once a state candidate-list adapter exists
  polls:                 {every_hours: 12}
  census_demographics:   {every_days: 30}
  historical_results:    {every_days: 30}
  verify_sources:        {every_days: 7}
  validation:            {every_hours: 6}
  daily_report:          {cron: "15 6 * * *"}
  # Election window (election day through certification)
  projections:           {every_minutes: 2,  active_from: "2026-11-03T18:00:00-05:00", active_to: "2026-12-15T00:00:00-05:00"}
  live_results:          {every_minutes: 5,  active_from: "2026-11-03T18:00:00-05:00", active_to: "2026-11-10T00:00:00-05:00"}
  certification_watch:   {every_minutes: 60, active_from: "2026-11-04T00:00:00-05:00", active_to: "2027-01-06T00:00:00-05:00"}

